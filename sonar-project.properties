sonar.projectKey=aswinrajmk_playwright-ui-framework
sonar.projectName=Playwright UI Framework
sonar.organization=aswinrajmk

# Source and test directories
sonar.sources=src
sonar.tests=tests

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions — skip generated/third-party files
sonar.exclusions=\
  **/node_modules/**,\
  **/test-results/**,\
  **/allure-results/**,\
  **/allure-report/**,\
  **/playwright-report/**
