name: Mock Suite
run-name: "Mock_Suite_#${{ github.run_number }}_(${{ github.event.inputs.environment }})"

# Trigger: manual only — choose environment before running
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run mock tests against"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

# ─────────────────────────────────────────────────────────────────────────────
# TESTS INCLUDED IN THIS SUITE  (defined in suites/mock.config.ts)
#
# UI Tests (chromium):
#   auth/login.spec.ts
#     ✔ PROJ-105  should show error when username is empty
#     ✔ PROJ-106  should show error when password is empty
#   cart/cart.spec.ts
#     ✔ PROJ-306  should update cart badge after removal
#   checkout/checkout.spec.ts
#     ✔ PROJ-404  should show error for empty first name
#     ✔ PROJ-405  should show error for empty last name
#     ✔ PROJ-406  should show error for empty postal code
#
# API Tests:
#   api/users.spec.ts
#     ✔ PROJ-507  PATCH /posts/:id - should partially update a post
#     ✔ PROJ-508  DELETE /posts/:id - should delete a post
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  mock-ui:
    name: Mock — UI (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Capture Chromium version
        run: |
          CHROMIUM_BIN=$(find ~/.cache/ms-playwright -path "*/chrome-linux/chrome" -type f 2>/dev/null | head -1)
          mkdir -p allure-results
          if [ -n "$CHROMIUM_BIN" ]; then
            "$CHROMIUM_BIN" --version 2>/dev/null | head -1 > allure-results/.browser-version || echo "Chromium" > allure-results/.browser-version
          else
            echo "Chromium" > allure-results/.browser-version
          fi

      - name: Run Mock UI tests
        env:
          ENV: ${{ github.event.inputs.environment }}
          CI: "true"
        run: npx playwright test --config suites/mock.config.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-ui-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-mock-ui
          path: allure-results/
          retention-days: 1

  mock-api:
    name: Mock — API (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Run Mock API tests
        env:
          ENV: ${{ github.event.inputs.environment }}
          CI: "true"
        run: npx playwright test --config suites/mock.config.ts --project=api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-api-results
          path: test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-mock-api
          path: allure-results/
          retention-days: 1

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [mock-ui, mock-api]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous Allure history from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          path: allure-results-all
          pattern: allure-results-mock-*
          merge-multiple: true

      - name: Copy previous Allure history
        run: |
          if [ -d "gh-pages/mock/history" ]; then
            cp -r gh-pages/mock/history allure-results-all/history
            echo "History copied from gh-pages/mock"
          else
            echo "No previous history found, starting fresh"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm install -g allure-commandline@2.32.0

      - name: Write Allure environment
        run: |
          NODE_VER=$(node --version)
          PW_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).devDependencies['@playwright/test'])")
          OS_INFO=$(uname -sr)
          BROWSER_VER=$(cat allure-results-all/.browser-version 2>/dev/null | tr -d '\n' || echo "Chromium")
          cat > allure-results-all/environment.properties << EOF
          Environment=${{ github.event.inputs.environment }}
          Browser=${BROWSER_VER}
          Base.URL=https://www.saucedemo.com
          API.URL=https://jsonplaceholder.typicode.com
          Node.Version=${NODE_VER}
          Playwright.Version=${PW_VER}
          OS=${OS_INFO}
          Runner=ubuntu-latest
          Build.Number=${{ github.run_number }}
          Branch=${{ github.ref_name }}
          EOF

      - name: Write Allure executor
        env:
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          cat > allure-results-all/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/$REPO",
            "buildOrder": $RUN_NUMBER,
            "buildName": "$WORKFLOW #$RUN_NUMBER",
            "buildUrl": "https://github.com/$REPO/actions/runs/$RUN_ID",
            "reportUrl": "https://$OWNER.github.io/$REPO_NAME/mock/",
            "reportName": "Allure Report"
          }
          EOF

      - name: Copy Allure categories
        run: cp allure-config/categories.json allure-results-all/categories.json

      - name: Generate Allure report
        run: allure generate allure-results-all --clean -o allure-report

      - uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-mock
          path: allure-report/
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: mock
          keep_files: true
