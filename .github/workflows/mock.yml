name: Mock Suite
run-name: "Mock_Suite_#${{ github.run_number }}_(${{ github.event.inputs.environment }})"

# Trigger: manual only — choose environment before running
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run mock tests against"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

# ─────────────────────────────────────────────────────────────────────────────
# TESTS INCLUDED IN THIS SUITE  (defined in suites/mock.config.ts)
#
# UI Tests (chromium):
#   auth/login.spec.ts
#     ✔ PROJ-105  should show error when username is empty
#     ✔ PROJ-106  should show error when password is empty
#   cart/cart.spec.ts
#     ✔ PROJ-306  should update cart badge after removal
#   checkout/checkout.spec.ts
#     ✔ PROJ-404  should show error for empty first name
#     ✔ PROJ-405  should show error for empty last name
#     ✔ PROJ-406  should show error for empty postal code
#
# API Tests:
#   api/users.spec.ts
#     ✔ PROJ-507  PATCH /posts/:id - should partially update a post
#     ✔ PROJ-508  DELETE /posts/:id - should delete a post
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  mock-ui:
    name: Mock — UI (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Mock UI tests
        env:
          ENV: ${{ github.event.inputs.environment }}
          CI: "true"
        run: npx playwright test --config suites/mock.config.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-ui-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  mock-api:
    name: Mock — API (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Run Mock API tests
        env:
          ENV: ${{ github.event.inputs.environment }}
          CI: "true"
        run: npx playwright test --config suites/mock.config.ts --project=api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-api-results
          path: test-results/
          retention-days: 7
