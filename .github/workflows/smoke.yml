name: Smoke Tests

# Trigger: every push to dev or main
on:
  push:
    branches: [main, dev]

# ─────────────────────────────────────────────────────────────────────────────
# TESTS INCLUDED IN THIS SUITE  (tag: @sanity)
# Add/remove tests by editing the tag in the spec file, not here.
#
# UI Tests (chromium):
#   login.spec.ts
#     ✔ should display login page elements
#     ✔ should login with valid credentials
#   inventory.spec.ts
#     ✔ should display products after login
#     ✔ should add product to cart and update badge
#   cart.spec.ts
#     ✔ should display cart with added items
#     ✔ should proceed to checkout
#   checkout.spec.ts
#     ✔ should complete full checkout flow
#   product-detail.spec.ts
#     ✔ should display product details
#
# API Tests:
#   users.spec.ts
#     ✔ GET /users - should return list of users
#     ✔ POST /posts - should create a new post
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  smoke-ui:
    name: Smoke — UI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run @sanity UI tests
        env:
          ENV: dev
          CI: "true"
        run: npx playwright test --grep "@sanity" --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ui-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  smoke-api:
    name: Smoke — API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Run @sanity API tests
        env:
          ENV: dev
          CI: "true"
        run: npx playwright test --grep "@sanity" --project=api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api-results
          path: test-results/
          retention-days: 7
