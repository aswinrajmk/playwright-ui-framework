name: Playwright Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      project:
        description: "Browser project to run"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [chromium]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run Playwright tests
        env:
          ENV: ${{ github.event.inputs.environment || 'dev' }}
          CI: true
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 30

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        env:
          ENV: ${{ github.event.inputs.environment || 'dev' }}
          CI: true
        run: npx playwright test --project=api

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            test-results/
            allure-results/
          retention-days: 30

  # ── Docker image security scan (Trivy) ────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # required to upload SARIF to GitHub Security tab
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --target runner \
            --tag playwright-ui-framework:${{ github.sha }} \
            .

      # Human-readable table output — always visible in CI logs
      - name: Trivy scan (table output)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: playwright-ui-framework:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"           # don't fail here; SARIF step controls gate

      # SARIF upload — surfaces findings in GitHub Security → Code scanning tab
      - name: Trivy scan (SARIF upload)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: playwright-ui-framework:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"           # informational — results visible in Security tab without blocking CI

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()               # upload even if Trivy exit-code was non-zero
        with:
          sarif_file: trivy-results.sarif

  # ── Run tests inside the Docker image ────────────────────────────────────
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --target runner \
            --tag playwright-ui-framework:ci \
            .

      - name: Prepare output directories
        run: mkdir -p test-results allure-results playwright-report && chmod -R 777 test-results allure-results playwright-report

      - name: Run tests in Docker
        run: |
          docker run --rm \
            -e CI=true \
            -e ENV=${{ github.event.inputs.environment || 'dev' }} \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            playwright-ui-framework:ci \
            npx playwright test --project=chromium

      - name: Upload Docker test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-test-results
          path: |
            test-results/
            playwright-report/
            allure-results/
          retention-days: 30

  allure-report:
    runs-on: ubuntu-latest
    needs: [test, api-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: allure-results-all
          pattern: allure-results-*
          merge-multiple: true

      - name: Setup Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.32.0

      - name: Generate Allure report
        run: allure generate allure-results-all --clean -o allure-report

      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
