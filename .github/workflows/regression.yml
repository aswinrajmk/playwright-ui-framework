name: Regression Tests

# Trigger: nightly schedule + manual
on:
  schedule:
    - cron: '0 0 * * *'     # daily at midnight UTC (5:30 AM IST)
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# TESTS INCLUDED IN THIS SUITE  (tag: @regression)
# Add/remove tests by editing the tag in the spec file, not here.
#
# UI Tests (chromium):
#   login.spec.ts
#     ✔ should show error for invalid credentials
#     ✔ should show error for locked out user
#   inventory.spec.ts
#     ✔ should display header with logo and cart
#     ✔ should add multiple products to cart
#     ✔ should remove product from cart on inventory page
#     ✔ should sort products by name A-Z
#     ✔ should sort products by name Z-A
#     ✔ should sort products by price low to high
#     ✔ should sort products by price high to low
#     ✔ should navigate to product detail page
#     ✔ should logout successfully
#   cart.spec.ts
#     ✔ should display correct item names in cart
#     ✔ should remove item from cart
#     ✔ should continue shopping from cart
#   checkout.spec.ts
#     ✔ should cancel checkout and return to cart
#     ✔ should return to products after checkout complete
#   product-detail.spec.ts
#     ✔ should add product to cart from detail page
#     ✔ should remove product from cart on detail page
#     ✔ should navigate back to products
#
# API Tests:
#   users.spec.ts
#     ✔ GET /users/:id - should return a single user
#     ✔ GET /posts - should return list of posts
#     ✔ GET /posts?userId=1 - should filter posts by user
#     ✔ PUT /posts/:id - should update a post
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  regression-ui:
    name: Regression — UI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run @regression UI tests
        env:
          ENV: dev
          CI: "true"
        run: npx playwright test --grep "@regression" --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-ui-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-regression-ui
          path: allure-results/
          retention-days: 1

  regression-api:
    name: Regression — API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Run @regression API tests
        env:
          ENV: dev
          CI: "true"
        run: npx playwright test --grep "@regression" --project=api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-api-results
          path: test-results/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-regression-api
          path: allure-results/
          retention-days: 1

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [regression-ui, regression-api]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: allure-results-all
          pattern: allure-results-regression-*
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm install -g allure-commandline@2.32.0

      - name: Generate Allure report
        run: allure generate allure-results-all --clean -o allure-report

      - uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
