name: Regression Suite
run-name: "Regression_Suite_#${{ github.run_number }}"

# Trigger: nightly schedule + manual
on:
  schedule:
    - cron: '0 0 * * *'     # daily at midnight UTC (5:30 AM IST)
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# TESTS INCLUDED IN THIS SUITE  (defined in suites/regression.config.ts)
#
# UI Tests (chromium):
#   auth/login.spec.ts
#     ✔ PROJ-101  should display login page elements
#     ✔ PROJ-102  should login with valid credentials
#     ✔ PROJ-103  should show error for invalid credentials
#     ✔ PROJ-104  should show error for locked out user
#     ✔ PROJ-105  should show error when username is empty
#     ✔ PROJ-106  should show error when password is empty
#   inventory/inventory.spec.ts
#     ✔ PROJ-201  should display products after login
#     ✔ PROJ-202  should add product to cart and update badge
#     ✔ PROJ-203  should display header with logo and cart
#     ✔ PROJ-204  should add multiple products to cart
#     ✔ PROJ-205  should remove product from cart on inventory page
#     ✔ PROJ-206  should sort products by name A-Z
#     ✔ PROJ-207  should sort products by name Z-A
#     ✔ PROJ-208  should sort products by price low to high
#     ✔ PROJ-209  should sort products by price high to low
#     ✔ PROJ-210  should navigate to product detail page
#     ✔ PROJ-211  should logout successfully
#   inventory/product-detail.spec.ts
#     ✔ PROJ-212  should display product details
#     ✔ PROJ-213  should add product to cart from detail page
#     ✔ PROJ-214  should remove product from cart on detail page
#     ✔ PROJ-215  should navigate back to products
#   cart/cart.spec.ts
#     ✔ PROJ-301  should display cart with added items
#     ✔ PROJ-302  should proceed to checkout
#     ✔ PROJ-303  should display correct item names in cart
#     ✔ PROJ-304  should remove item from cart
#     ✔ PROJ-305  should continue shopping from cart
#     ✔ PROJ-306  should update cart badge after removal
#   checkout/checkout.spec.ts
#     ✔ PROJ-401  should complete full checkout flow
#     ✔ PROJ-402  should cancel checkout and return to cart
#     ✔ PROJ-403  should return to products after checkout complete
#     ✔ PROJ-404  should show error for empty first name
#     ✔ PROJ-405  should show error for empty last name
#     ✔ PROJ-406  should show error for empty postal code
#
# API Tests:
#   api/users.spec.ts
#     ✔ PROJ-501  GET /users - should return list of users
#     ✔ PROJ-502  POST /posts - should create a new post
#     ✔ PROJ-503  GET /users/:id - should return a single user
#     ✔ PROJ-504  GET /posts - should return list of posts
#     ✔ PROJ-505  GET /posts?userId=1 - should filter posts by user
#     ✔ PROJ-506  PUT /posts/:id - should update a post
#     ✔ PROJ-507  PATCH /posts/:id - should partially update a post
#     ✔ PROJ-508  DELETE /posts/:id - should delete a post
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  regression-ui:
    name: Regression — UI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Capture Chromium version
        run: |
          CHROMIUM_BIN=$(find ~/.cache/ms-playwright -path "*/chrome-linux/chrome" -type f 2>/dev/null | head -1)
          mkdir -p allure-results
          if [ -n "$CHROMIUM_BIN" ]; then
            "$CHROMIUM_BIN" --version 2>/dev/null | head -1 > allure-results/.browser-version || echo "Chromium" > allure-results/.browser-version
          else
            echo "Chromium" > allure-results/.browser-version
          fi

      - name: Run Regression UI tests
        env:
          ENV: dev
          CI: "true"
        run: npx playwright test --config suites/regression.config.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-ui-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-regression-ui
          path: allure-results/
          retention-days: 1

  regression-api:
    name: Regression — API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Run Regression API tests
        env:
          ENV: dev
          CI: "true"
        run: npx playwright test --config suites/regression.config.ts --project=api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-api-results
          path: test-results/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-regression-api
          path: allure-results/
          retention-days: 1

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [regression-ui, regression-api]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous Allure history from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          path: allure-results-all
          pattern: allure-results-regression-*
          merge-multiple: true

      - name: Copy previous Allure history
        run: |
          if [ -d "gh-pages/regression/history" ]; then
            cp -r gh-pages/regression/history allure-results-all/history
            echo "History copied from gh-pages/regression"
          else
            echo "No previous history found, starting fresh"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm install -g allure-commandline@2.32.0

      - name: Write Allure environment
        run: |
          mkdir -p allure-results-all
          NODE_VER=$(node --version)
          PW_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).devDependencies['@playwright/test'])")
          OS_INFO=$(uname -sr)
          BROWSER_VER=$(cat allure-results-all/.browser-version 2>/dev/null | tr -d '\n' || echo "Chromium")
          cat > allure-results-all/environment.properties << EOF
          Environment=dev
          Browser=${BROWSER_VER}
          Base.URL=https://www.saucedemo.com
          API.URL=https://jsonplaceholder.typicode.com
          Node.Version=${NODE_VER}
          Playwright.Version=${PW_VER}
          OS=${OS_INFO}
          Runner=ubuntu-latest
          Build.Number=${{ github.run_number }}
          Branch=${{ github.ref_name }}
          EOF

      - name: Write Allure executor
        env:
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          cat > allure-results-all/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/$REPO",
            "buildOrder": $RUN_NUMBER,
            "buildName": "$WORKFLOW #$RUN_NUMBER",
            "buildUrl": "https://github.com/$REPO/actions/runs/$RUN_ID",
            "reportUrl": "https://$OWNER.github.io/$REPO_NAME/regression/",
            "reportName": "Allure Report"
          }
          EOF

      - name: Copy Allure categories
        run: cp allure-config/categories.json allure-results-all/categories.json

      - name: Generate Allure report
        run: allure generate allure-results-all --clean -o allure-report

      - uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: regression
          keep_files: true
